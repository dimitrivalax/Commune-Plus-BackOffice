# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 0
  maxInstances: 20
  concurrency: 80
  cpu: 1
  memoryMiB: 512

# Environment variables (valeurs issues de .env).
# Pour les secrets sensibles, préférer Cloud Secret Manager et "secret: NOM" en prod.
env:
  # Firebase (client BackOffice)
  - variable: NUXT_PUBLIC_FIREBASE_API_KEY
    secret: NUXT_PUBLIC_FIREBASE_API_KEY
    availability:
      - BUILD
      - RUNTIME
  - variable: NUXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    secret: NUXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    availability:
      - BUILD
      - RUNTIME
  - variable: NUXT_PUBLIC_FIREBASE_PROJECT_ID
    secret: NUXT_PUBLIC_FIREBASE_PROJECT_ID
    availability:
      - BUILD
      - RUNTIME
  - variable: NUXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    secret: NUXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    availability:
      - BUILD
      - RUNTIME
  - variable: NUXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    secret: NUXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    availability:
      - BUILD
      - RUNTIME
  - variable: NUXT_PUBLIC_FIREBASE_APP_ID
    secret: NUXT_PUBLIC_FIREBASE_APP_ID
    availability:
      - BUILD
      - RUNTIME
  # Firebase Admin (serveur)
  - variable: FIREBASE_SERVICE_ACCOUNT_JSON
    secret: FIREBASE_SERVICE_ACCOUNT_JSON
    availability:
      - RUNTIME
  - variable: NODE_OPTIONS
    value: "--max-old-space-size=4096"
    availability:
      - BUILD
  - variable: APP_URL
    value: "https://backoffice.commune-plus.fr"
    availability:
      - RUNTIME
  # Facebook / Meta Graph API (serveur)
  - variable: FACEBOOK_APP_ID
    secret: FACEBOOK_APP_ID
    availability:
      - RUNTIME
  - variable: FACEBOOK_APP_SECRET
    secret: FACEBOOK_APP_SECRET
    availability:
      - RUNTIME
  - variable: FACEBOOK_OAUTH_CALLBACK_URL
    value: "https://backoffice.commune-plus.fr/api/facebook/callback"
    availability:
      - RUNTIME
  - variable: FACEBOOK_OAUTH_STATE_SECRET
    secret: FACEBOOK_OAUTH_STATE_SECRET
    availability:
      - RUNTIME
  - variable: FACEBOOK_TOKEN_ENCRYPTION_KEY
    secret: FACEBOOK_TOKEN_ENCRYPTION_KEY
    availability:
      - RUNTIME
  - variable: FACEBOOK_GRAPH_API_VERSION
    value: "v25.0"
    availability:
      - RUNTIME

  # Cloudinary
  - variable: CLOUDINARY_CLOUD_NAME
    value: "REDACTED"
    availability:
      - BUILD
      - RUNTIME
  - variable: CLOUDINARY_UPLOAD_PRESET
    value: "Commune Plus"
    availability:
      - BUILD
      - RUNTIME
  - variable: CLOUDINARY_API_KEY
    secret: CLOUDINARY_API_KEY
  - variable: CLOUDINARY_API_SECRET
    secret: CLOUDINARY_API_SECRET

  # PostHog
  - variable: POSTHOG_API_KEY
    value: "REDACTED"
    availability:
      - BUILD
      - RUNTIME
  - variable: POSTHOG_HOST
    value: "https://eu.i.posthog.com"
    availability:
      - BUILD
      - RUNTIME
  - variable: POSTHOG_PROJECT_ID
    secret: POSTHOG_PROJECT_ID
    availability:
      - RUNTIME
  - variable: POSTHOG_PERSONAL_API_KEY
    secret: POSTHOG_PERSONAL_API_KEY
    availability:
      - RUNTIME

  # Resend
  - variable: RESEND_API_KEY
    value: "REDACTED"
    availability:
      - RUNTIME
  - variable: RESEND_FROM_EMAIL
    value: "contact@commune-plus.fr"
    availability:
      - RUNTIME

  # FCM fallback (si FIREBASE_SERVICE_ACCOUNT_JSON n'est pas utilisé)
  - variable: FCM_SERVICE_ACCOUNT_JSON
    secret: FCM_SERVICE_ACCOUNT_JSON
    availability:
      - RUNTIME
